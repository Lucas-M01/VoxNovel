name: Mobile quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.15.0'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install workspaces
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile --non-interactive
      - name: Install verified Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o /tmp/checksums.txt
          digest=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' /tmp/checksums.txt)
          echo "$digest  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Check mobile and secrets
        env:
          GITLEAKS_BIN: /tmp/gitleaks
        run: python scripts/check.py --scope mobile
