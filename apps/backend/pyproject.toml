[tool.poetry]
name = "voxnovel-backend"
version = "0.1.0"
description = "VoxNovel API"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = ">=0.164,<0.165"
pydantic-settings = ">=2.0,<3"
uvicorn = ">=0.30,<1"
supabase = "^2.34.1"
python-slugify = "^9.2.0"
dnspython = ">=2.7,<3"
beautifulsoup4 = ">=4.14,<5"
lxml = ">=6,<7"
cloudscraper = "1.2.71"
curl-cffi = ">=0.13,<1"

[tool.poetry.group.dev.dependencies]
httpx = ">=0.28,<1"
mypy = ">=1.0,<2"
pytest = ">=8,<10"
ruff = ">=0.14,<1"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable local Supabase stack"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["cloudscraper.*"]
ignore_missing_imports = true
